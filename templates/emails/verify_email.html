{% extends "emails/base.html" %}{% block body %}
<h2 style="margin:0 0 12px">Confirm your email</h2>
<p>Hi {{ user.get_short_name }}, confirm your address to activate your account. The link is valid for 48 hours.</p>
<p><a href="{{ url }}" style="background:#2563EB;color:#FFFFFF;padding:11px 18px;border-radius:8px;text-decoration:none;display:inline-block">Confirm my email</a></p>
<p style="color:#6B7280;font-size:13px">If the button does not work, copy this link: {{ url }}</p>{% endblock %}
