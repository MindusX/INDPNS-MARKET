{% extends "emails/base.html" %}{% block body %}
<h2 style="margin:0 0 12px">Reset your password</h2>
<p>Use the button below to choose a new password. If you did not ask for this, ignore this email.</p>
<p><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" style="background:#2563EB;color:#FFFFFF;padding:11px 18px;border-radius:8px;text-decoration:none;display:inline-block">Choose a new password</a></p>{% endblock %}
