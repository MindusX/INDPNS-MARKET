{% extends "auth/base_auth.html" %}
{% load i18n %}
{% block content %}{% if validlink %}<h1>{% trans "Choose a new password" %}</h1>
<form method="post" novalidate>{% csrf_token %}{% include "auth/_form.html" %}<button class="btn btn-primary btn-block" type="submit">{% trans "Save password" %}</button></form>
{% else %}<h1>{% trans "Invalid or expired link" %}</h1><a class="btn btn-block" href="{% url 'accounts:password_reset' %}">{% trans "Request a new link" %}</a>{% endif %}{% endblock %}
