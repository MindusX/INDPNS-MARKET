{% load i18n core_tags %}
{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="{% trans 'Pagination' %}">
  {% if page.has_previous %}<a href="?{% qs_replace page=page.previous_page_number %}">‹ {% trans "Previous" %}</a>{% endif %}
  <span class="current">{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% qs_replace page=page.next_page_number %}">{% trans "Next" %} ›</a>{% endif %}
</nav>
{% endif %}
